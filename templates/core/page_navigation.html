{% if page.has_other_pages %}
  <nav class="mt-4" aria-label="Halaman">
    {% if page.has_previous %}<a href="?page={{ page.previous_page_number }}">Sebelumnya</a>{% endif %}
    <span>{{ page.number }} / {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a href="?page={{ page.next_page_number }}">Berikutnya</a>{% endif %}
  </nav>
{% endif %}
