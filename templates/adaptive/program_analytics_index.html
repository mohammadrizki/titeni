{% extends "core/base.html" %}
{% block title %}Analitik Prodi · Titeni{% endblock %}
{% block content %}
<section class="mx-auto max-w-5xl px-4 py-12">
  <h1 id="analytics-programs-title" class="heading">Analitik Prodi</h1>
  <div class="table-wrap keyboard-scroll mt-4" role="region" aria-labelledby="analytics-programs-title" tabindex="0"><table class="data-table" aria-labelledby="analytics-programs-title">
    <thead><tr><th scope="col">Prodi</th><th scope="col" class="table-action-column">Aksi</th></tr></thead>
    <tbody>{% for program in programs %}
      <tr><th scope="row">{{ program.name }}</th><td><a href="{% url 'academics:program_analytics' program.pk %}">Lihat periode<span class="sr-only"> {{ program.name }}</span></a></td></tr>
    {% empty %}<tr><td colspan="2">Belum ada prodi yang dapat diakses.</td></tr>{% endfor %}</tbody>
  </table></div>
</section>
{% endblock %}
