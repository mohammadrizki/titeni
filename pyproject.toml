[project]
name = "titeni"
version = "0.1.0"
description = "Adaptive reflective e-portfolio and competency development"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "django-stubs",
    "mypy",
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[[tool.mypy.overrides]]
module = ["environ"]
ignore_missing_imports = true
